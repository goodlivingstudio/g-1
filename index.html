<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-1 · EXG Intelligence System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* ── Stage ─────────────────────────────────────────────────────────────── */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.18s ease-in;
    }

    #stage.fade { opacity: 0; }

    /* ── Image slides ────────────────────────────────────────────────────── */
    #slide-img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
    }

    /* ── Iframe slides ───────────────────────────────────────────────────── */
    #slide-iframe {
      display: none;
      position: absolute;
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: center center;
      flex-shrink: 0;
    }

    /* ── Progress bar ────────────────────────────────────────────────────── */
    #progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 1px;
      background: #2a2a2a;
      transition: width 0.25s ease;
      z-index: 200;
      pointer-events: none;
    }

    /* ── Counter ─────────────────────────────────────────────────────────── */
    #counter {
      position: fixed;
      bottom: 20px;
      right: 28px;
      color: #333;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      z-index: 200;
      pointer-events: none;
      transition: color 0.3s;
    }

    #counter:hover { color: #666; }

    /* ── Hint ────────────────────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #2a2a2a;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      white-space: nowrap;
      z-index: 200;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    #hint.gone { opacity: 0; }

    /* ── Nav arrows ──────────────────────────────────────────────────────── */
    #nav-prev, #nav-next {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 120px;
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #nav-prev { left: 0; }
    #nav-next { right: 0; }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    #nav-prev:hover .nav-btn,
    #nav-next:hover .nav-btn {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.55);
      transform: scale(1.12);
    }

    .arrow {
      width: 22px;
      height: 22px;
      border-left: 2.5px solid rgba(255,255,255,0.9);
      border-bottom: 2.5px solid rgba(255,255,255,0.9);
    }

    #nav-prev .arrow { transform: rotate(45deg) translate(4px, -4px); }
    #nav-next .arrow { transform: rotate(-135deg) translate(-4px, -4px); }

    /* ── Hotspot overlay ─────────────────────────────────────────────────── */
    #hotspot-layer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
    }

    #hotspot-canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
    }

    .hotspot {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
    }

    .hotspot-link {
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .hotspot-link:hover { border-color: rgba(255,255,255,0.4); }

    /* ── Grid overview ───────────────────────────────────────────────────── */
    #grid {
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 500;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #grid.open {
      display: flex;
      opacity: 0;
    }

    #grid.open.visible {
      opacity: 1;
    }

    #grid-header {
      padding: 28px 32px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #111;
      flex-shrink: 0;
    }

    #grid-label {
      color: #333;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #grid-close {
      color: #333;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: color 0.15s;
    }

    #grid-close:hover { color: #888; }

    #grid-inner {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 32px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      align-content: start;
    }

    /* custom scrollbar */
    #grid-inner::-webkit-scrollbar { width: 4px; }
    #grid-inner::-webkit-scrollbar-track { background: transparent; }
    #grid-inner::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    .grid-item {
      cursor: pointer;
      position: relative;
    }

    .grid-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      border: 1px solid #111;
      transition: border-color 0.15s, opacity 0.15s;
      opacity: 0.7;
    }

    .grid-item:hover .grid-thumb { border-color: #333; opacity: 0.9; }
    .grid-item.current .grid-thumb { border-color: #555; opacity: 1; }

    .grid-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 5px;
      padding: 0 1px;
    }

    .grid-num {
      color: #2a2a2a;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .grid-name {
      color: #333;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.06em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid-item.current .grid-num { color: #555; }
    .grid-item.current .grid-name { color: #555; }
  </style>
</head>
<body>

<div id="stage">
  <img id="slide-img" src="" alt="">
  <iframe id="slide-iframe" tabindex="-1" allowfullscreen></iframe>
</div>

<div id="progress"></div>
<div id="counter"></div>
<div id="hint">← → navigate &nbsp;·&nbsp; G overview &nbsp;·&nbsp; F fullscreen</div>

<div id="hotspot-layer"><div id="hotspot-canvas"></div></div>

<div id="nav-prev"><div class="nav-btn"><div class="arrow"></div></div></div>
<div id="nav-next"><div class="nav-btn"><div class="arrow"></div></div></div>

<!-- Grid overview -->
<div id="grid">
  <div id="grid-header">
    <span id="grid-label">G-1 · EXG Intelligence System</span>
    <span id="grid-close">ESC to close</span>
  </div>
  <div id="grid-inner"></div>
</div>

<script>
  // ── Slide config ──────────────────────────────────────────────────────────
  const SLIDE_NAMES = [
    'Cover',                    // 01
    'Contents',                 // 02
    'Introduction',             // 03
    'What This Is / Isn\'t',    // 04
    'Journey States',           // 05
    'The Gap',                  // 06
    'Architecture',             // 07
    'System Architecture',      // 08
    'Zone Map',                 // 09
    'The Field',                // 10 · interactive
    'The Surface',              // 11
    'Examples',                 // 12
    'Landing Experience',       // 13
    'Notification Center',      // 14
    'AI Search',                // 15
    'AI Chat',                  // 16
    'Megamenus',                // 17
    'Megamenu',                 // 18 · interactive
    'Account Profile',          // 19
    'Account Profile',          // 20 · interactive
    'Frameworks',               // 21
    'Three Interaction Modes',  // 22
    'Signal Taxonomy',          // 23
    'Signal Inventory',         // 24
    'Archetypes',               // 25
    'Render Pipeline',          // 26
    'Principles',               // 27
    'Build Plan',               // 28
    'Let\'s Start Building',    // 29
    'Appendix',                 // 30
    'Appendix · Links',         // 31 · interactive
    'Thank You',                // 32
  ];

  const IFRAME_SLIDES = {
     9: 'field_interactive.html',
    17: 'slide-18-interactive.html',
    19: 'slide-20-interactive.html',
    30: 'slide-31-interactive.html'
  };
  const HOTSPOTS = {};

  const SLIDE_IMGS = Array.from({ length: 32 }, (_, i) => `slide-${String(i+1).padStart(2,'0')}.jpg`);

  let current = 0;
  let gridOpen = false;
  let transitioning = false;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const stage          = document.getElementById('stage');
  const img            = document.getElementById('slide-img');
  const iframe         = document.getElementById('slide-iframe');
  const counter        = document.getElementById('counter');
  const hint           = document.getElementById('hint');
  const progress       = document.getElementById('progress');
  const hotspotCanvas  = document.getElementById('hotspot-canvas');
  const grid           = document.getElementById('grid');
  const gridInner      = document.getElementById('grid-inner');
  const navPrev        = document.getElementById('nav-prev');
  const navNext        = document.getElementById('nav-next');

  // ── Scaling ───────────────────────────────────────────────────────────────
  function getScale() {
    return Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  }

  function applyScale() {
    const s = getScale();
    iframe.style.transform       = `scale(${s})`;
    hotspotCanvas.style.transform = `scale(${s})`;
  }

  window.addEventListener('resize', applyScale);

  // ── Hotspots ──────────────────────────────────────────────────────────────
  function renderHotspots(index) {
    hotspotCanvas.innerHTML = '';
    const spots = HOTSPOTS[index];
    if (!spots) return;
    spots.forEach(({ x, y, w, h, url, type }) => {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'hotspot' + (type === 'link' ? ' hotspot-link' : '');
      Object.assign(a.style, { left: x+'px', top: y+'px', width: w+'px', height: h+'px' });
      hotspotCanvas.appendChild(a);
    });
  }

  // ── Show slide ────────────────────────────────────────────────────────────
  function setContent(index) {
    const iframeUrl = IFRAME_SLIDES[index];

    if (iframeUrl !== undefined) {
      if (iframe.dataset.loaded !== iframeUrl) {
        iframe.src = iframeUrl;
        iframe.dataset.loaded = iframeUrl;
      }
      img.style.display    = 'none';
      iframe.style.display = 'block';
    } else {
      img.src              = SLIDE_IMGS[index];
      img.style.display    = 'block';
      iframe.style.display = 'none';
    }

    renderHotspots(index);
    applyScale();

    counter.textContent = `${index + 1} / ${SLIDE_IMGS.length}`;
    progress.style.width = `${((index + 1) / SLIDE_IMGS.length) * 100}%`;

    // Sync grid highlight
    document.querySelectorAll('.grid-item').forEach((el, i) => {
      el.classList.toggle('current', i === index);
    });
  }

  function show(index, instant) {
    const target = Math.max(0, Math.min(SLIDE_IMGS.length - 1, index));
    if (target === current && !instant) return;
    current = target;

    if (instant) {
      setContent(current);
      return;
    }

    if (transitioning) return;
    transitioning = true;

    stage.classList.add('fade');
    setTimeout(() => {
      setContent(current);
      // Brief pause at black, then fade in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          stage.classList.remove('fade');
          stage.style.transition = 'opacity 0.28s ease-out';
          setTimeout(() => {
            stage.style.transition = 'opacity 0.18s ease-in';
            transitioning = false;
          }, 300);
        });
      });
    }, 180);
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  // ── Grid overview ─────────────────────────────────────────────────────────
  function buildGrid() {
    gridInner.innerHTML = '';
    SLIDE_IMGS.forEach((src, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item' + (i === current ? ' current' : '');
      item.innerHTML = `
        <img class="grid-thumb" src="${src}" alt="" loading="lazy">
        <div class="grid-meta">
          <span class="grid-num">${String(i+1).padStart(2,'0')}</span>
          <span class="grid-name">${SLIDE_NAMES[i] || ''}</span>
        </div>`;
      item.addEventListener('click', () => {
        closeGrid();
        show(i);
      });
      gridInner.appendChild(item);
    });
  }

  function openGrid() {
    buildGrid();
    gridOpen = true;
    grid.classList.add('open');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => grid.classList.add('visible'));
    });
    // Scroll current slide into view
    setTimeout(() => {
      const cur = gridInner.querySelector('.current');
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 50);
  }

  function closeGrid() {
    gridOpen = false;
    grid.classList.remove('visible');
    setTimeout(() => grid.classList.remove('open'), 200);
  }

  document.getElementById('grid-close').addEventListener('click', closeGrid);

  // ── Fullscreen ────────────────────────────────────────────────────────────
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  // ── Preload ───────────────────────────────────────────────────────────────
  function preload(index) {
    if (index >= 0 && index < SLIDE_IMGS.length) {
      new Image().src = SLIDE_IMGS[index];
    }
  }

  img.addEventListener('load', () => {
    preload(current + 1);
    preload(current + 2);
  });

  // ── Navigation clicks ─────────────────────────────────────────────────────
  navPrev.addEventListener('click', prev);
  navNext.addEventListener('click', next);

  // ── Keyboard ──────────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (gridOpen) {
      if (e.key === 'Escape' || e.key === 'g' || e.key === 'G') closeGrid();
      return;
    }
    switch (e.key) {
      case 'ArrowRight':
      case 'ArrowDown':
      case ' ':
        e.preventDefault(); next(); break;
      case 'ArrowLeft':
      case 'ArrowUp':
        e.preventDefault(); prev(); break;
      case 'f': case 'F':
        toggleFullscreen(); break;
      case 'g': case 'G':
        openGrid(); break;
      case 'Escape':
        if (document.fullscreenElement) document.exitFullscreen();
        break;
      case 'Home': show(0); break;
      case 'End':  show(SLIDE_IMGS.length - 1); break;
    }
  });

  // ── Hint fade ─────────────────────────────────────────────────────────────
  setTimeout(() => hint.classList.add('gone'), 5000);

  // ── Init ──────────────────────────────────────────────────────────────────
  show(0, true);
  preload(1);
  preload(2);
</script>
</body>
</html>
