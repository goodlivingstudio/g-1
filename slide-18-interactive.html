<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>18 · Megamenu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    img.slide-bg { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: block; }

    .link {
      position: absolute;
      left: 592px; top: 466px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 120px; font-weight: 500;
      letter-spacing: -0.025em; line-height: 1;
      color: transparent;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer; z-index: 10;
    }

    .link::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 0;
      width: var(--uw, 100%); height: 3px;
      background: #fff;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link:hover::after { transform: scaleX(1); }
  </style>
</head>
<body>
  <img class="slide-bg" src="slide-18.jpg" alt="">
  <a class="link" href="https://app.paper.design/file/01KQSYB20G4P4E36WKCHV0YKB0/7-2" target="_blank" rel="noopener noreferrer">See comps</a>
  <script>
    document.fonts.ready.then(() => {
      document.querySelectorAll('.link').forEach(link => {
        const cs = getComputedStyle(link);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        if ('letterSpacing' in ctx) ctx.letterSpacing = cs.letterSpacing;
        ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' Inter';
        const m = ctx.measureText(link.textContent.trim());
        link.style.setProperty('--uw', Math.ceil(m.actualBoundingBoxRight) + 'px');
      });
    });
  </script>
</body>
</html>
